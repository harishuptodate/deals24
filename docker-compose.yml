
services:
  frontend:
    profiles: [frontend]
    # image: harishuptodate/deals24-frontend:v1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:3000/api
    ports:
      - "8080:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3000/api} # if value is given here, this is the final value it considers, if not given here, it takes from .env file
    networks:
      - deals24-network

  backend:
    # image: harishuptodate/deals24-backend:v1
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_AUTH_SECRET=${ADMIN_AUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - ADMIN_LOG_PERSIST_LEVEL=${ADMIN_LOG_PERSIST_LEVEL:-warn}
      - ADMIN_LOG_STREAM_LEVEL=${ADMIN_LOG_STREAM_LEVEL:-info}
      - ADMIN_LOG_RECENT_LIMIT=${ADMIN_LOG_RECENT_LIMIT:-300}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - IS_SALE_MODE=${IS_SALE_MODE:-false}
      - GEMINI_DEAL_ENRICHMENT_ENABLED=${GEMINI_DEAL_ENRICHMENT_ENABLED:-${GEMINI_IDENTITY_EXTRACTION_ENABLED:-true}}
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - AMAZON_AFFILIATE_TAG=${AMAZON_AFFILIATE_TAG:-harishch-21}
      - AMAZON_IMAGE_FALLBACK_API_URL=${AMAZON_IMAGE_FALLBACK_API_URL:-https://amznpf.onrender.com/api/fetch-image}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-Deals24}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://deals24.vercel.app}
      - TEXT_REPLACEMENTS=${TEXT_REPLACEMENTS:-}
      - LINKS_TO_REPLACE=${LINKS_TO_REPLACE:-}
      - LINK_REPLACE_WITH=${LINK_REPLACE_WITH:-}
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - deals24-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - deals24-network
    restart: unless-stopped

volumes:
  redis-data:

networks:
  deals24-network:
    driver: bridge
